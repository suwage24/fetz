<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terms and Conditions</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #2C3E50 0%, #00c08b 100%);
      font-family: "Times New Roman", Times, serif;
      color: #eee;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 40px 24px 48px;
      background: rgba(44, 62, 80, 0.7);
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.18);
    }
    h1 {
      color: #00c08b;
      text-align: center;
      margin-bottom: 32px;
    }
    .btn-primary {
      background: linear-gradient(90deg, #00c08b 0%, #00B87B 100%);
      border: none;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .btn-primary:hover {
      background: linear-gradient(90deg, #00B87B 0%, #00c08b 100%);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,192,139,0.15);
    }
  </style>
</head>
<body class="bg-dark text-light">
  <div class="container">
    <h1>Terms and Conditions</h1>
    <p>By using this site, you agree to be respectful, follow the rules, and not misuse any of the content or features provided.</p>
    <a href="website.html" class="btn btn-primary mt-3">⬅ Back to Home</a>
  </div>
</body>
</html>
