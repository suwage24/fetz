<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Business</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2C3E50 0%, #00c08b 100%);
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
            color: #eee;
            min-height: 100vh;
        }
        .container {
            padding: 60px 100px;
            max-width: 1000px;
            margin: 40px auto;
            color: #eee;
            border-radius: 24px;
            background: rgba(44, 62, 80, 0.7);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.18);
        }

        h1 {
            text-align: center;
            color: #00c08b;
            margin-bottom: 20px;
        }
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .service-box {
            background: rgba(49, 67, 85, 0.85);
            padding: 24px;
            border: 1.5px solid #00c08b;
            border-radius: 18px;
            text-align: center;
            color: #eee;
            box-shadow: 0 4px 24px rgba(0,192,139,0.10);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .service-box:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 32px rgba(0,192,139,0.18);
        }

        .service-box h3 {
            color: #00c08b;
            margin-bottom: 30px;
        }
        .btn-primary {
            background: linear-gradient(90deg, #00c08b 0%, #00B87B 100%);
            border: none;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #00B87B 0%, #00c08b 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,192,139,0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Business Page</h1>
        <div class="services">
            <div class="service-box">
                <h3>Website Development</h3>
                <p>Example Only</p>
            </div>
            <div class="service-box">
                <h3>Digital Marketing</h3>
                <p>Example Only</p>
            </div>
            <div class="service-box">
                <h3>Product Photography</h3>
                <p>Example Only</p>
            </div>
        </div>
        <a href="website.html" class="btn btn-primary mt-3">⬅ Back to Home</a>
  </div>
    </div>
</body>
</html>
