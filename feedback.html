<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2C3E50 0%, #00c08b 100%);
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
            color: #eee;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            padding: 50px 20px 10px;
            font-size: 40px;
            color: #00c08b;
        }

        .feedback-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px 20px 60px;
            font-size: 18px;
            color: #eee;
            border-radius: 24px;
            background: rgba(44, 62, 80, 0.7);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.18);
        }

        p.description {
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            background: rgba(255,255,255,0.08);
            padding: 25px;
            border-radius: 18px;
            color: #eee;
            box-shadow: 0 4px 24px 0 rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.12);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #00c08b;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1.5px solid #00c08b;
            font-size: 16px;
            background: rgba(255,255,255,0.15);
            color: #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: border 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border: 2px solid #00B87B;
            box-shadow: 0 0 0 2px #00c08b33;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            background: linear-gradient(90deg, #00c08b 0%, #00B87B 100%);
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            transition: background 0.3s, box-shadow 0.3s;
        }
        button:hover {
            background: linear-gradient(90deg, #00B87B 0%, #00c08b 100%);
            box-shadow: 0 4px 16px rgba(0,192,139,0.15);
        }
        .btn-primary {
            background-color: #00c08b;
            border: none;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #00B87B;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>Feedback</h1>

    <div class="feedback-container">
        <p class="description">I’d love to hear your thoughts! Please fill out the form below to send me your feedback.</p>

        <form action="#" method="post">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
        <a href="website.html" class="btn btn-primary mt-3">⬅ Back to Home</a>
  </div>
    </div>

</body>
</html>
