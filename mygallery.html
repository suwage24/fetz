<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2C3E50 0%, #00c08b 100%);
            font-family: "Times New Roman", Times, serif;
            color: #eee;
            min-height: 100vh;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            padding: 60px;
            max-width: 1200px;
            margin: 40px auto;
            border-radius: 24px;
            background: rgba(44, 62, 80, 0.7);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.18);
        }
        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 18px;
            border: 3px solid #00c08b;
            box-shadow: 0 4px 24px rgba(0,192,139,0.15);
            background: rgba(255,255,255,0.12);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .gallery img:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 32px rgba(0,192,139,0.25);
        }
        .btn-primary {
            background: linear-gradient(90deg, #00c08b 0%, #00B87B 100%);
            border: none;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .btn-primary:hover {
            background: linear-gradient(90deg, #00B87B 0%, #00c08b 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0,192,139,0.15);
        }
    </style>
</head>
<body>
    <div class="gallery">
        <img src="img/christine3.jpg">
        <img src="img/christine4.jpg">
        <img src="img/christine5.jpg">
        <a href="website.html" class="btn btn-primary mt-3">⬅ Back to Home</a>
    </div> 
</body>
</html>
